<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>MAZ AI</title>

  <script>
    (function() {
      if (localStorage.getItem('maz_user_email')) {
        document.documentElement.classList.add('maz-logged-in');
      }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23c084fc'/><stop offset='100%25' stop-color='%23a855f7'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='%230a0a0f'/><ellipse cx='50' cy='50' rx='35' ry='14' stroke='url(%23g)' stroke-width='2.5' fill='none' transform='rotate(-30 50 50)'/><ellipse cx='50' cy='50' rx='35' ry='14' stroke='url(%23g)' stroke-width='2.5' fill='none' transform='rotate(30 50 50)'/><ellipse cx='50' cy='50' rx='35' ry='14' stroke='url(%23g)' stroke-width='2.5' fill='none' transform='rotate(90 50 50)'/><path d='M 32 62 L 32 42 L 42 55 L 50 44 L 58 55 L 68 42 L 68 62' stroke='url(%23g)' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    html, body { height: 100%; width: 100%; }
    body {
      background-color: #0a0a0f;
      color: #e2e8f0;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: row; overflow: hidden;
    }

    html.maz-logged-in #login-overlay { display: none !important; }

    input::-webkit-contacts-auto-fill-button,
    input::-webkit-credentials-auto-fill-button,
    input::-webkit-credit-card-auto-fill-button,
    input::-webkit-strong-password-auto-fill-button {
      visibility: hidden !important; display: none !important;
      pointer-events: none !important; position: absolute !important;
      right: 0 !important; opacity: 0 !important;
    }
    textarea::-webkit-contacts-auto-fill-button,
    textarea::-webkit-credentials-auto-fill-button,
    textarea::-webkit-credit-card-auto-fill-button {
      visibility: hidden !important; display: none !important;
    }

    #login-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 40%, #12121a 0%, #0a0a0f 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px; overflow: hidden;
    }
    .login-bg-glow {
      position: absolute; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, transparent 60%);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      animation: glowPulse 6s ease-in-out infinite; pointer-events: none; filter: blur(40px);
    }
    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.85; }
    }
    .login-card {
      position: relative; background: #0f0f16;
      border: 1px solid rgba(124, 58, 237, 0.3);
      padding: 44px 40px; border-radius: 24px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(124, 58, 237, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px); max-width: 420px; width: 100%;
      animation: cardRise 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardRise {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-logo {
      display: flex; justify-content: center;
      filter: drop-shadow(0 0 25px rgba(192, 132, 252, 0.5));
      animation: logoFloat 4s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .login-title { font-size: 26px; font-weight: 700; color: #e2e8f0; margin: 0; letter-spacing: 0.3px; }
    .login-title span {
      background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-subtitle { font-size: 14px; color: #94a3b8; margin: 0 0 8px 0; max-width: 300px; line-height: 1.5; }
    .login-divider {
      display: flex; align-items: center; width: 100%; gap: 12px;
      margin: 6px 0; color: #4a5568; font-size: 12px;
      text-transform: uppercase; letter-spacing: 1.5px;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.4), transparent);
    }
    .guest-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; width: 100%; padding: 13px 20px;
      background: transparent; border: 1.5px solid rgba(192, 132, 252, 0.4);
      color: #e2e8f0; border-radius: 999px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.25s; font-family: inherit;
    }
    .guest-btn:hover {
      background: rgba(192, 132, 252, 0.1); border-color: #c084fc;
      transform: translateY(-1px); box-shadow: 0 0 25px rgba(192, 132, 252, 0.3);
    }
    .login-hint { font-size: 12px; color: #64748b; margin: 0; font-style: italic; }

    .sidebar {
      width: 260px; background-color: #0d0d12;
      border-right: 1px solid #1c1c26;
      display: flex; flex-direction: column; height: 100%;
      flex-shrink: 0; transition: margin-left 0.3s ease, transform 0.3s ease;
    }
    .sidebar.closed { margin-left: -260px; }
    .sidebar-header {
      padding: 16px; border-bottom: 1px solid #1c1c26;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sidebar-close-btn {
      background: transparent; border: none; color: #c084fc; font-size: 20px;
      cursor: pointer; padding: 4px 10px; border-radius: 6px;
      line-height: 1; transition: all 0.2s; font-family: inherit;
    }
    .sidebar-close-btn:hover, .sidebar-close-btn:active { background: #1a1a28; color: #e9d5ff; }
    .history-list {
      flex: 1; overflow-y: auto; padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .history-item-wrapper { position: relative; display: flex; align-items: center; }
    .history-item {
      flex: 1; padding: 10px 32px 10px 12px; border-radius: 8px;
      background: #141420; color: #94a3b8; font-size: 14px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      border: 1px solid transparent;
    }
    .history-item:hover, .history-item-wrapper.active .history-item {
      background: #1a1a28; color: #c084fc; border-color: #2e2e44;
    }
    .history-menu-btn {
      position: absolute; right: 6px; background: transparent; border: none;
      color: #94a3b8; font-size: 16px; cursor: pointer;
      padding: 2px 6px; border-radius: 4px; display: none;
    }
    .history-item-wrapper:hover .history-menu-btn,
    .history-item-wrapper.active .history-menu-btn { display: block; }
    .history-menu-btn:hover { color: #ffffff; background: #2e2e44; }

    .sidebar-user-footer {
      padding: 14px 16px; border-top: 1px solid #1c1c26;
      display: flex; align-items: center; gap: 12px; background-color: #0d0d12;
    }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
      border: 1px solid #7c3aed;
    }
    .user-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
    .user-name {
      font-size: 14px; font-weight: 600; color: #e2e8f0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-email {
      font-size: 12px; color: #94a3b8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .guest-signin-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      color: white; border: none; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.25s; font-family: inherit;
    }
    .guest-signin-btn:hover { transform: translateY(-1px); box-shadow: 0 0 15px rgba(124, 58, 237, 0.5); }

    .context-menu, .attach-menu {
      position: fixed; background: #0f0f16;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(124, 58, 237, 0.3); border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(124, 58, 237, 0.15);
      width: 190px; z-index: 999; display: none; flex-direction: column;
      overflow: hidden; padding: 6px;
      animation: menuPop 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes menuPop {
      from { opacity: 0; transform: translateY(6px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .context-menu-item, .attach-menu-item {
      padding: 10px 12px; font-size: 14px; color: #cbd5e1;
      display: flex; align-items: center; gap: 12px; cursor: pointer;
      border-radius: 10px; transition: all 0.18s; font-weight: 500;
    }
    .context-menu-item svg, .attach-menu-item svg {
      width: 18px; height: 18px; stroke: currentColor; stroke-width: 2;
      flex-shrink: 0; transition: all 0.18s;
    }
    .context-menu-item:hover, .attach-menu-item:hover {
      background: rgba(124, 58, 237, 0.15); color: #e9d5ff; transform: translateX(2px);
    }
    .context-menu-item:hover svg, .attach-menu-item:hover svg {
      stroke: #c084fc; filter: drop-shadow(0 0 6px rgba(192, 132, 252, 0.6));
    }
    .context-menu-item.delete:hover { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
    .context-menu-item.delete:hover svg {
      stroke: #f87171; filter: drop-shadow(0 0 6px rgba(248, 113, 113, 0.6));
    }

    .main-workspace { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; min-height: 0; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid #1c1c26;
    }
    .brand-group { display: flex; align-items: center; gap: 12px; }
    .toggle-sidebar-btn {
      background: transparent; border: none; color: #c084fc;
      font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    }
    .toggle-sidebar-btn:hover { background: #1a1a28; }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 20px; color: #c084fc;
    }
    .top-new-chat-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      color: white; border: none; width: 38px; height: 38px;
      border-radius: 50%; font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-weight: 300; transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .top-new-chat-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .top-new-chat-btn:active { transform: translateY(0) scale(0.97); }

    #chat-container {
      flex: 1; min-height: 0; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 16px;
      max-width: 850px; width: 100%; margin: 0 auto;
      scrollbar-width: thin; scrollbar-color: #2e2e44 #0a0a0f;
    }
    #chat-container::-webkit-scrollbar { width: 6px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }
    #chat-container::-webkit-scrollbar-thumb { background: #2e2e44; border-radius: 10px; }

    .welcome-placeholder {
      margin: auto; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: 12px; user-select: none;
    }
    .welcome-placeholder h1 { font-size: 32px; font-weight: 700; color: #c084fc; letter-spacing: 0.5px; }
    .welcome-placeholder p { font-size: 15px; color: #94a3b8; }

    .message.user {
      align-self: flex-end; background-color: #1a1a28; color: #f3e8ff;
      border: 1px solid #2e2e44; padding: 10px 16px; border-radius: 20px;
      max-width: 85%; font-size: 15px; white-space: pre-wrap; word-break: break-word;
    }
    .message.assistant {
      align-self: flex-start; color: #e2e8f0; padding: 4px 0;
      width: 100%; font-size: 15px; line-height: 1.6;
    }
    .message.assistant strong, .message.assistant b { color: #c084fc; font-weight: 600; }
    .message.assistant ul { margin: 6px 0 6px 20px; padding: 0; }
    .message.assistant li { margin-bottom: 4px; }
    .message.assistant code:not(.code-table code) {
      background-color: #1a1a28; color: #d8b4fe;
      padding: 2px 6px; border-radius: 6px; font-size: 13px;
    }

    /* Image wrapper with buttons */
    .gen-img-wrap {
      position: relative;
      display: inline-block;
      margin: 12px 0;
      max-width: 100%;
    }
    .generated-img {
      max-width: 100%; max-height: 380px; width: auto; height: auto;
      border-radius: 14px; border: 1px solid #7c3aed;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
      display: block; object-fit: contain;
    }
    .gen-img-actions {
      display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
    }
    .img-action-btn {
      background: transparent; border: 1px solid #2e2e44; color: #a78bfa;
      cursor: pointer; font-size: 13px; padding: 6px 14px;
      border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.22s; font-family: inherit; font-weight: 500;
    }
    .img-action-btn:hover {
      background: rgba(124, 58, 237, 0.15); border-color: #7c3aed;
      color: #e9d5ff; transform: translateY(-1px);
    }
    .img-action-btn:active { transform: translateY(0); }
    .img-action-btn svg {
      width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }

    .code-block-wrapper {
      background-color: #14141e; border: 1px solid #2a2a3a;
      border-radius: 10px; margin: 12px 0; overflow: hidden;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .code-header {
      display: flex; justify-content: space-between; align-items: center;
      background-color: #0f0f16; padding: 8px 14px;
      border-bottom: 1px solid #2a2a3a; font-size: 13px; color: #94a3b8;
    }
    .code-copy-btn {
      background-color: #1a1a28; color: #e2e8f0; border: 1px solid #2e2e44;
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .code-scroll-area { overflow-x: auto; padding: 10px 0; }
    .code-table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.5; }
    .code-table td { padding: 0; vertical-align: top; }
    .line-numbers {
      user-select: none; text-align: right; color: #4a5568;
      padding-right: 14px; padding-left: 12px;
      border-right: 1px solid #2a2a3a; width: 40px;
    }
    .code-content { padding-left: 14px; padding-right: 14px; white-space: pre; color: #abb2bf; }

    .speak-btn {
      background: transparent; border: none; color: #a78bfa; cursor: pointer;
      font-size: 15px; margin-top: 6px; margin-right: 8px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .chat-img {
      max-width: 220px; max-height: 220px; border-radius: 12px;
      display: block; margin-bottom: 8px; border: 1px solid #7c3aed; object-fit: cover;
    }

    footer {
      padding: 10px 14px 12px 14px; max-width: 850px; width: 100%;
      margin: 0 auto; display: flex; flex-direction: column;
      gap: 6px; flex-shrink: 0;
    }
    .input-card {
      display: flex; flex-direction: column; background-color: #0f0f16;
      border: 1px solid #2e2e44; border-radius: 20px; padding: 8px 12px; gap: 6px;
    }

    #image-preview-container { display: none; position: relative; width: fit-content; margin-bottom: 4px; }
    #image-preview { max-width: 80px; max-height: 80px; border-radius: 10px; border: 1px solid #7c3aed; object-fit: cover; }
    #remove-image-btn {
      position: absolute; top: -6px; right: -6px; background: #ef4444; color: white;
      border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .input-row { display: flex; align-items: center; gap: 10px; }

    /* TEXTAREA (for Shift+Enter new line) */
    #user-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #f3e8ff; font-size: 15px;
      -webkit-appearance: none; appearance: none;
      font-family: inherit; resize: none;
      max-height: 150px; min-height: 24px;
      line-height: 1.4;
      padding: 4px 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #2e2e44 transparent;
    }
    #user-input::-webkit-scrollbar { width: 4px; }
    #user-input::-webkit-scrollbar-thumb { background: #2e2e44; border-radius: 4px; }
    #user-input::placeholder { color: #64748b; }

    .actions-row { display: flex; align-items: center; justify-content: space-between; }
    .actions-left { display: flex; align-items: center; gap: 8px; position: relative; }
    .icon-btn {
      background: transparent; border: none; color: #c084fc; font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;
    }
    .icon-btn.recording { color: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .think-btn {
      display: flex; align-items: center; gap: 6px;
      background-color: #1a1a28; border: 1px solid #2e2e44; color: #d8b4fe;
      padding: 5px 10px 5px 8px; border-radius: 16px; font-size: 13px;
      font-weight: 500; cursor: pointer; transition: all 0.22s; font-family: inherit;
    }
    .think-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; transition: all 0.22s; }
    .think-btn:hover { background-color: #1f1f30; border-color: #7c3aed; color: #e9d5ff; }
    .think-btn.active {
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      color: white; border-color: transparent;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .think-btn.active svg { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8)); }

    .send-arrow-btn {
      background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%);
      color: white; border: none; width: 34px; height: 34px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; line-height: 1;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
    }
    .send-arrow-btn:hover {
      transform: translateY(-1px) scale(1.06);
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .send-arrow-btn:active { transform: translateY(0) scale(0.96); }
    .send-arrow-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .send-arrow-btn.stop-mode {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .send-arrow-btn.stop-mode .arrow-icon { display: none; }
    .send-arrow-btn.stop-mode::after {
      content: ''; width: 12px; height: 12px; background: white; border-radius: 2px;
    }

    .loading-dots { display: inline-flex; align-items: center; gap: 6px; padding: 8px 0; }
    .loading-dots span {
      width: 8px; height: 8px; border-radius: 50%; background: #c084fc;
      animation: dotBounce 1.4s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(192, 132, 252, 0.6);
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1.2); opacity: 1; }
    }

    .regen-btn {
      background: transparent; border: 1px solid #2e2e44; color: #a78bfa;
      cursor: pointer; font-size: 13px; padding: 5px 12px; border-radius: 999px;
      margin-top: 8px; display: inline-flex; align-items: center; gap: 5px;
      transition: all 0.22s; font-family: inherit;
    }
    .regen-btn:hover {
      background: rgba(124, 58, 237, 0.15); border-color: #7c3aed;
      color: #e9d5ff; transform: translateY(-1px);
    }
    .regen-btn:active { transform: translateY(0); }
    .regen-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; }

    .disclaimer-text { text-align: center; font-size: 11px; color: #64748b; }

    @media (max-width: 600px) {
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0;
        z-index: 500; box-shadow: 5px 0 25px rgba(0,0,0,0.8);
      }
      .sidebar.closed { margin-left: -260px; }
      .login-card { padding: 34px 24px; }
      .login-title { font-size: 22px; }
      .generated-img { max-height: 300px; }
    }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-bg-glow"></div>
    <div class="login-card">
      <div class="login-logo">
        <svg width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c084fc"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
            <radialGradient id="loginGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="100" height="100" rx="22" fill="#0a0a0f" stroke="#2e2e44" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="30" fill="url(#loginGlow)"/>
          <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#loginGrad)" stroke-width="2" fill="none" transform="rotate(-30 50 50)" opacity="0.75"/>
          <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#loginGrad)" stroke-width="2" fill="none" transform="rotate(30 50 50)" opacity="0.75"/>
          <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#loginGrad)" stroke-width="2" fill="none" transform="rotate(90 50 50)" opacity="0.75"/>
          <path d="M 32 62 L 32 42 L 42 55 L 50 44 L 58 55 L 68 42 L 68 62" stroke="url(#loginGrad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="85" cy="35" r="2.5" fill="#c084fc"/>
          <circle cx="18" cy="70" r="2.5" fill="#a855f7"/>
          <circle cx="50" cy="15" r="2" fill="#c084fc"/>
        </svg>
      </div>
      <h1 class="login-title">Welcome to <span>MAZ AI</span></h1>
      <p class="login-subtitle">Your intelligent assistant — sign in to save your chats</p>

      <div id="g_id_onload"
           data-client_id="38665812589-0h1ouegqmkh9ug7fehlj5seudglhf5rs.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_select="false"
           data-cancel_on_tap_outside="true"
           data-skip_prompt_cookie="maz_session">
      </div>
      <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill" data-text="signin_with" data-logo_alignment="left"></div>

      <div class="login-divider"><span>or</span></div>

      <button class="guest-btn" onclick="continueAsGuest()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Continue as Guest
      </button>

      <p class="login-hint">Guest chats won't be saved</p>
    </div>
  </div>

  <div class="sidebar closed" id="sidebar">
    <div class="sidebar-header">
      <span style="color: #c084fc; font-weight: 600;">Chat History</span>
      <button class="sidebar-close-btn" onclick="toggleSidebar()" aria-label="Close sidebar">✕</button>
    </div>
    <div class="history-list" id="history-list"></div>
    <div class="sidebar-user-footer" id="sidebar-user-footer">
      <img id="user-avatar-img" class="user-avatar" src="https://via.placeholder.com/36" alt="Profile" />
      <div class="user-info">
        <span class="user-name" id="user-display-name">Guest</span>
        <span class="user-email" id="user-display-email">Guest mode</span>
      </div>
      <button id="guest-signin-btn" class="guest-signin-btn" onclick="showLoginAgain()" style="display: none;">Sign in</button>
    </div>
  </div>

  <div class="context-menu" id="context-menu">
    <div class="context-menu-item" onclick="renameCurrentSession()">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      Rename
    </div>
    <div class="context-menu-item delete" onclick="deleteCurrentSession()">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6"/>
        <path d="M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
      Delete
    </div>
  </div>

  <div class="attach-menu" id="attach-menu">
    <div class="attach-menu-item" onclick="openGallery()">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      Gallery
    </div>
    <div class="attach-menu-item" onclick="openCamera()">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Camera
    </div>
  </div>

  <div class="main-workspace">
    <header>
      <div class="brand-group">
        <button class="toggle-sidebar-btn" title="Toggle History" onclick="toggleSidebar()">☰</button>
        <div class="brand">
          <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c084fc"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
            <rect width="100" height="100" rx="22" fill="#0a0a0f" stroke="#2e2e44" stroke-width="1.5"/>
            <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#headerGrad)" stroke-width="2" fill="none" transform="rotate(-30 50 50)" opacity="0.75"/>
            <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#headerGrad)" stroke-width="2" fill="none" transform="rotate(30 50 50)" opacity="0.75"/>
            <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#headerGrad)" stroke-width="2" fill="none" transform="rotate(90 50 50)" opacity="0.75"/>
            <path d="M 32 62 L 32 42 L 42 55 L 50 44 L 58 55 L 68 42 L 68 62" stroke="url(#headerGrad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>MAZ AI</span>
        </div>
      </div>
      <button class="top-new-chat-btn" title="New Chat" onclick="createNewChat()">+</button>
    </header>

    <div id="chat-container"></div>

    <footer>
      <div class="input-card">
        <div id="image-preview-container">
          <img id="image-preview" src="" alt="Selected Preview" />
          <button id="remove-image-btn" onclick="removeSelectedImage()">✕</button>
        </div>
        <div class="input-row">
          <textarea
            id="user-input"
            name="maz_chat_input"
            autocomplete="new-password"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            data-lpignore="true"
            data-form-type="other"
            placeholder="Ask MAZ AI..."
            rows="1"
            onkeydown="handleInputKey(event)"
            onpaste="handlePaste(event)"
            oninput="autoResizeTextarea(this)"
          ></textarea>
        </div>
        <div class="actions-row">
          <div class="actions-left">
            <button class="icon-btn" id="plus-attach-btn" title="Add Image" onclick="toggleAttachMenu(event)">+</button>
            <input type="file" id="file-input-gallery" accept="image/*" style="display: none;" onchange="handleImageSelect(event)" />
            <input type="file" id="file-input-camera" accept="image/*" capture="environment" style="display: none;" onchange="handleImageSelect(event)" />
            <button class="icon-btn" id="mic-btn" title="Speak" onclick="toggleVoiceInput()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>
            <button class="think-btn" id="think-toggle" onclick="toggleThink()">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2z"/>
                <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2z"/>
              </svg>
              <span>Think</span>
            </button>
          </div>
          <button class="send-arrow-btn" id="sendBtn" onclick="handleSendOrStop()">
            <span class="arrow-icon">➔</span>
          </button>
        </div>
      </div>
      <p class="disclaimer-text">MAZ is AI and can make mistakes.</p>
    </footer>
  </div>

  <script>
    let currentUserEmail = localStorage.getItem('maz_user_email') || null;
    let currentUserName = localStorage.getItem('maz_user_name') || 'Guest';
    let currentUserPicture = localStorage.getItem('maz_user_picture') || 'https://via.placeholder.com/36';

    let isThinkActive = false;
    let selectedImageBase64 = null;
    let chatHistory = [];
    let allSessions = [];
    let currentSessionId = null;
    let selectedMenuSessionId = null;
    let recognition = null;
    let isRecording = false;
    let currentAbortController = null;
    let isGenerating = false;

    function setSessionCookie() {
      document.cookie = "maz_session=active; path=/; max-age=31536000; SameSite=Lax";
    }
    function clearSessionCookie() {
      document.cookie = "maz_session=; path=/; max-age=0; SameSite=Lax";
    }

    if (currentUserEmail) {
      document.documentElement.classList.add('maz-logged-in');
      setSessionCookie();
    }

    function updateProfileUI() {
      document.getElementById('user-display-name').innerText = currentUserName;
      document.getElementById('user-display-email').innerText = currentUserEmail || 'Guest mode';
      document.getElementById('user-avatar-img').src = currentUserPicture;
      const guestBtn = document.getElementById('guest-signin-btn');
      if (guestBtn) guestBtn.style.display = currentUserEmail ? 'none' : 'inline-block';
    }

    function getStorageKey() {
      return currentUserEmail ? `maz_sessions_${currentUserEmail}` : 'maz_sessions_guest';
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('closed');
    }

    function toggleAttachMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('attach-menu');
      const btn = document.getElementById('plus-attach-btn');
      const rect = btn.getBoundingClientRect();
      if (menu.style.display === 'flex') {
        menu.style.display = 'none';
      } else {
        menu.style.display = 'flex';
        menu.style.bottom = `${window.innerHeight - rect.top + 8}px`;
        menu.style.left = `${rect.left}px`;
      }
    }

    function openGallery() {
      document.getElementById('attach-menu').style.display = 'none';
      document.getElementById('file-input-gallery').click();
    }

    function openCamera() {
      document.getElementById('attach-menu').style.display = 'none';
      document.getElementById('file-input-camera').click();
    }

    function saveAllSessions() {
      if (!currentUserEmail) {
        renderSidebarHistory();
        return;
      }
      localStorage.setItem(getStorageKey(), JSON.stringify(allSessions));
      renderSidebarHistory();
    }

    function loadAllSessions() {
      if (!currentUserEmail) {
        allSessions = [];
        renderSidebarHistory();
        createNewChat();
        return;
      }
      const saved = localStorage.getItem(getStorageKey());
      if (saved) {
        try { allSessions = JSON.parse(saved); } catch (e) { allSessions = []; }
      } else {
        allSessions = [];
      }
      renderSidebarHistory();
      if (allSessions.length > 0) {
        loadSession(allSessions[0].id);
      } else {
        createNewChat();
      }
    }

    function createNewChat() {
      window.speechSynthesis.cancel();
      currentSessionId = Date.now().toString();
      chatHistory = [];
      removeSelectedImage();
      renderEmptyState();
      renderSidebarHistory();
    }

    function loadSession(id) {
      window.speechSynthesis.cancel();
      currentSessionId = id;
      const session = allSessions.find(s => s.id === id);
      if (session) {
        chatHistory = session.history || [];
        renderLoadedChat();
      }
      renderSidebarHistory();
      if (window.innerWidth <= 600) {
        document.getElementById('sidebar').classList.add('closed');
      }
    }

    function openContextMenu(e, sessionId) {
      e.stopPropagation();
      selectedMenuSessionId = sessionId;
      const menu = document.getElementById('context-menu');
      menu.style.display = 'flex';
      menu.style.top = `${e.clientY}px`;
      menu.style.left = `${e.clientX}px`;
    }

    document.addEventListener('click', () => {
      document.getElementById('context-menu').style.display = 'none';
      document.getElementById('attach-menu').style.display = 'none';
    });

    function renameCurrentSession() {
      if (!selectedMenuSessionId) return;
      const session = allSessions.find(s => s.id === selectedMenuSessionId);
      if (session) {
        const newTitle = prompt("Enter new title for this chat:", session.title);
        if (newTitle && newTitle.trim() !== '') {
          session.title = newTitle.trim();
          saveAllSessions();
        }
      }
    }

    function deleteCurrentSession() {
      if (!selectedMenuSessionId) return;
      if (confirm("Are you sure you want to delete this chat?")) {
        allSessions = allSessions.filter(s => s.id !== selectedMenuSessionId);
        saveAllSessions();
        if (currentSessionId === selectedMenuSessionId) {
          if (allSessions.length > 0) loadSession(allSessions[0].id);
          else createNewChat();
        }
      }
    }

    function renderSidebarHistory() {
      const listContainer = document.getElementById('history-list');
      listContainer.innerHTML = '';
      allSessions.forEach(session => {
        const wrapper = document.createElement('div');
        wrapper.className = `history-item-wrapper ${session.id === currentSessionId ? 'active' : ''}`;
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerText = session.title || 'Untitled Chat';
        item.onclick = () => loadSession(session.id);
        const menuBtn = document.createElement('button');
        menuBtn.className = 'history-menu-btn';
        menuBtn.innerHTML = '⋮';
        menuBtn.onclick = (e) => openContextMenu(e, session.id);
        wrapper.appendChild(item);
        wrapper.appendChild(menuBtn);
        listContainer.appendChild(wrapper);
      });
    }

    function renderLoadedChat() {
      const container = document.getElementById('chat-container');
      container.innerHTML = '';
      if (chatHistory.length === 0) {
        renderEmptyState();
        return;
      }
      chatHistory.forEach(item => {
        let text = '';
        let image = null;
        if (Array.isArray(item.content)) {
          const textObj = item.content.find(c => c.type === 'text');
          const imgObj = item.content.find(c => c.type === 'image_url');
          if (textObj) text = textObj.text;
          if (imgObj && imgObj.image_url) image = imgObj.image_url.url;
        } else {
          text = item.content;
        }
        addMessageToUI(item.role, text, image, false);
      });
      container.scrollTop = container.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateProfileUI();
      if (currentUserEmail) {
        const saved = localStorage.getItem(getStorageKey());
        if (saved) {
          try { allSessions = JSON.parse(saved); } catch (e) { allSessions = []; }
        } else {
          allSessions = [];
        }
        renderSidebarHistory();
      } else {
        allSessions = [];
        renderSidebarHistory();
      }
      createNewChat();
      setupSpeechRecognition();
    });

    function renderEmptyState() {
      const container = document.getElementById('chat-container');
      container.innerHTML = `
        <div class="welcome-placeholder" id="welcome-placeholder">
          <svg width="88" height="88" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="welcomeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c084fc"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
              <radialGradient id="welcomeGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="100" height="100" rx="22" fill="#0a0a0f" stroke="#2e2e44" stroke-width="1.5"/>
            <circle cx="50" cy="50" r="30" fill="url(#welcomeGlow)"/>
            <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#welcomeGrad)" stroke-width="2" fill="none" transform="rotate(-30 50 50)" opacity="0.75"/>
            <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#welcomeGrad)" stroke-width="2" fill="none" transform="rotate(30 50 50)" opacity="0.75"/>
            <ellipse cx="50" cy="50" rx="35" ry="14" stroke="url(#welcomeGrad)" stroke-width="2" fill="none" transform="rotate(90 50 50)" opacity="0.75"/>
            <path d="M 32 62 L 32 42 L 42 55 L 50 44 L 58 55 L 68 42 L 68 62" stroke="url(#welcomeGrad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="85" cy="35" r="2.5" fill="#c084fc"/>
            <circle cx="18" cy="70" r="2.5" fill="#a855f7"/>
            <circle cx="50" cy="15" r="2" fill="#c084fc"/>
          </svg>
          <h1>MAZ AI</h1>
          <p>How can I help you today?</p>
        </div>
      `;
    }

    function handleCredentialResponse(response) {
      const payload = jwt_decode(response.credential);
      currentUserEmail = payload.email;
      currentUserName = payload.name || 'Muhammad Ali Zahid';
      currentUserPicture = payload.picture || 'https://via.placeholder.com/36';
      localStorage.setItem('maz_user_email', currentUserEmail);
      localStorage.setItem('maz_user_name', currentUserName);
      localStorage.setItem('maz_user_picture', currentUserPicture);
      document.documentElement.classList.add('maz-logged-in');
      setSessionCookie();
      document.getElementById('login-overlay').style.display = 'none';
      updateProfileUI();
      loadAllSessions();
    }

    function continueAsGuest() {
      currentUserEmail = null;
      currentUserName = 'Guest';
      currentUserPicture = 'https://via.placeholder.com/36';
      localStorage.removeItem('maz_sessions_guest');
      localStorage.removeItem('maz_user_email');
      localStorage.removeItem('maz_user_name');
      localStorage.removeItem('maz_user_picture');
      document.documentElement.classList.remove('maz-logged-in');
      clearSessionCookie();
      document.getElementById('login-overlay').style.display = 'none';
      updateProfileUI();
      allSessions = [];
      renderSidebarHistory();
      createNewChat();
    }

    function showLoginAgain() {
      document.documentElement.classList.remove('maz-logged-in');
      clearSessionCookie();
      document.getElementById('login-overlay').style.display = 'flex';
    }

    function toggleThink() {
      isThinkActive = !isThinkActive;
      document.getElementById('think-toggle').classList.toggle('active', isThinkActive);
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';
        recognition.onresult = (event) => {
          document.getElementById('user-input').value = event.results[0][0].transcript;
          stopRecording();
        };
        recognition.onerror = () => stopRecording();
        recognition.onend = () => stopRecording();
      }
    }

    function toggleVoiceInput() {
      if (!recognition) {
        alert("Speech recognition is not supported in this browser.");
        return;
      }
      if (isRecording) {
        recognition.stop();
        stopRecording();
      } else {
        recognition.start();
        isRecording = true;
        const micBtn = document.getElementById('mic-btn');
        micBtn.classList.add('recording');
        micBtn.title = "Listening...";
      }
    }

    function stopRecording() {
      isRecording = false;
      const micBtn = document.getElementById('mic-btn');
      if (micBtn) {
        micBtn.classList.remove('recording');
        micBtn.title = "Speak";
      }
    }

    function speakText(text) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*_`#]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (file) processImageFile(file);
    }

    function handlePaste(event) {
      const items = (event.clipboardData || event.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf("image") !== -1) {
          processImageFile(item.getAsFile());
          event.preventDefault();
          break;
        }
      }
    }

    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const MAX_SIZE = 800;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > MAX_SIZE) {
              height = Math.round((height * MAX_SIZE) / width);
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width = Math.round((width * MAX_SIZE) / height);
              height = MAX_SIZE;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.75);
          document.getElementById('image-preview').src = selectedImageBase64;
          document.getElementById('image-preview-container').style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeSelectedImage() {
      selectedImageBase64 = null;
      document.getElementById('file-input-gallery').value = '';
      document.getElementById('file-input-camera').value = '';
      document.getElementById('image-preview').src = '';
      document.getElementById('image-preview-container').style.display = 'none';
    }

    function copyCodeToClipboard(button, textToCopy) {
      navigator.clipboard.writeText(textToCopy).then(() => {
        button.innerText = 'Copied!';
        setTimeout(() => { button.innerText = 'Copy'; }, 2000);
      });
    }

    // ===== IMAGE ACTIONS: DOWNLOAD & COPY =====
    function downloadImage(url, btn) {
      const filename = 'maz-ai-image-' + Date.now() + '.jpg';
      fetch(url)
        .then(res => res.blob())
        .then(blob => {
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
          if (btn) {
            const orig = btn.innerHTML;
            btn.innerHTML = '✅ Downloaded';
            setTimeout(() => { btn.innerHTML = orig; }, 1800);
          }
        })
        .catch(() => {
          // fallback: open image in new tab so user can save
          window.open(url, '_blank');
        });
    }

    async function copyImageToClipboard(url, btn) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        // Convert to PNG for clipboard (some browsers require png)
        const img = await createImageBitmap(blob);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': pngBlob })
        ]);
        const orig = btn.innerHTML;
        btn.innerHTML = '✅ Copied!';
        setTimeout(() => { btn.innerHTML = orig; }, 1800);
      } catch (err) {
        // fallback: copy the URL
        try {
          await navigator.clipboard.writeText(url);
          const orig = btn.innerHTML;
          btn.innerHTML = '🔗 Link copied';
          setTimeout(() => { btn.innerHTML = orig; }, 1800);
        } catch (e2) {
          alert('Could not copy image. Long-press the image to save it.');
        }
      }
    }

    function renderMarkdown(rawText) {
      const blocks = [];
      let placeholderText = rawText.replace(/```([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        const index = blocks.length;
        blocks.push({ lang: lang || 'code', code: code.trim() });
        return `___CODE_BLOCK_${index}___`;
      });

      let html = placeholderText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");

      // Convert markdown image → wrapped image with action buttons
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, url) => {
        const safeUrl = url.replace(/"/g, '&quot;');
        return `<div class="gen-img-wrap"><img src="${safeUrl}" alt="${alt}" class="generated-img" /><div class="gen-img-actions"><button class="img-action-btn" onclick="downloadImage('${safeUrl}', this)"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download</button><button class="img-action-btn" onclick="copyImageToClipboard('${safeUrl}', this)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button></div></div>`;
      });

      const lines = html.split("\n");
      let formattedHtml = "";
      let inList = false;

      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith("___CODE_BLOCK_") || trimmed.startsWith("<div class=\"gen-img-wrap\"")) {
          if (inList) { formattedHtml += "</ul>"; inList = false; }
          formattedHtml += line;
          continue;
        }
        const listMatch = trimmed.match(/^-\s+(.*)$/);
        if (listMatch) {
          if (!inList) { formattedHtml += "<ul>"; inList = true; }
          formattedHtml += `<li>${listMatch[1]}</li>`;
        } else {
          if (inList) { formattedHtml += "</ul>"; inList = false; }
          if (trimmed === "") formattedHtml += "<br>";
          else formattedHtml += `<div>${trimmed}</div>`;
        }
      }
      if (inList) formattedHtml += "</ul>";

      blocks.forEach((item, index) => {
        let highlightedCode = item.code;
        if (window.hljs) {
          if (item.lang && hljs.getLanguage(item.lang)) {
            highlightedCode = hljs.highlight(item.code, { language: item.lang }).value;
          } else {
            highlightedCode = hljs.highlightAuto(item.code).value;
          }
        }
        const linesArr = highlightedCode.split('\n');
        const lineNumsHtml = linesArr.map((_, i) => `<div>${i + 1}</div>`).join('');
        const codeLinesHtml = linesArr.map(line => `<div>${line || ' '}</div>`).join('');
        const safeCodeForAttr = encodeURIComponent(item.code);
        const codeBlockHtml = `
          <div class="code-block-wrapper">
            <div class="code-header">
              <span>${item.lang}</span>
              <button class="code-copy-btn" onclick="copyCodeToClipboard(this, decodeURIComponent('${safeCodeForAttr}'))">Copy</button>
            </div>
            <div class="code-scroll-area">
              <table class="code-table">
                <tr>
                  <td class="line-numbers">${lineNumsHtml}</td>
                  <td class="code-content">${codeLinesHtml}</td>
                </tr>
              </table>
            </div>
          </div>
        `;
        formattedHtml = formattedHtml.replace(`___CODE_BLOCK_${index}___`, codeBlockHtml);
      });

      return formattedHtml;
    }

    function addMessageToUI(role, text, image, autoScroll = true) {
      const container = document.getElementById('chat-container');
      const placeholder = document.getElementById('welcome-placeholder');
      if (placeholder) placeholder.remove();

      const div = document.createElement('div');
      div.className = `message ${role}`;

      if (image) {
        const img = document.createElement('img');
        img.src = image;
        img.className = 'chat-img';
        div.appendChild(img);
      }

      if (text) {
        if (role === 'assistant') {
          const wrapper = document.createElement('div');
          wrapper.innerHTML = renderMarkdown(text);

          const speakBtn = document.createElement('button');
          speakBtn.className = 'speak-btn';
          speakBtn.innerHTML = '🔊 <span>Listen</span>';
          speakBtn.onclick = () => speakText(text);

          const regenBtn = document.createElement('button');
          regenBtn.className = 'regen-btn';
          regenBtn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Regenerate
          `;
          regenBtn.onclick = () => regenerateMessage();

          const btnRow = document.createElement('div');
          btnRow.style.cssText = 'display:flex;align-items:center;flex-wrap:wrap;';
          btnRow.appendChild(speakBtn);
          btnRow.appendChild(regenBtn);

          div.appendChild(wrapper);
          div.appendChild(btnRow);
        } else {
          const textSpan = document.createElement('span');
          textSpan.textContent = text;
          div.appendChild(textSpan);
        }
      }

      container.appendChild(div);
      if (autoScroll) container.scrollTop = container.scrollHeight;
    }

    function handleSendOrStop() {
      if (isGenerating) {
        if (currentAbortController) currentAbortController.abort();
        isGenerating = false;
        updateSendBtn();
      } else {
        sendMessage();
      }
    }

    function updateSendBtn() {
      const btn = document.getElementById('sendBtn');
      if (!btn) return;
      if (isGenerating) btn.classList.add('stop-mode');
      else btn.classList.remove('stop-mode');
    }

    async function regenerateMessage() {
      if (isGenerating) return;
      let lastUserIdx = -1;
      for (let i = chatHistory.length - 1; i >= 0; i--) {
        if (chatHistory[i].role === 'user') {
          lastUserIdx = i;
          break;
        }
      }
      if (lastUserIdx === -1) return;
      chatHistory = chatHistory.slice(0, lastUserIdx + 1);
      const session = allSessions.find(s => s.id === currentSessionId);
      if (session) {
        session.history = chatHistory;
        saveAllSessions();
      }
      renderLoadedChat();
      await sendMessage(true);
    }

    // ===== TEXTAREA AUTO-RESIZE =====
    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    // ===== INPUT KEY HANDLER (Shift+Enter = new line) =====
    function handleInputKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
      // Shift+Enter → default behavior (new line) — no preventDefault
    }

    async function sendMessage(isRegenerate = false) {
      if (isGenerating) return;

      const input = document.getElementById('user-input');
      const text = isRegenerate ? '' : input.value.trim();
      const imageToSend = isRegenerate ? null : selectedImageBase64;

      if (!isRegenerate && !text && !imageToSend) return;

      if (!isRegenerate) {
        addMessageToUI('user', text, imageToSend);

        let userMessageObj = { role: "user" };
        if (imageToSend) {
          userMessageObj.content = [
            { type: "text", text: text || "What is in this image?" },
            { type: "image_url", image_url: { url: imageToSend } }
          ];
        } else {
          userMessageObj.content = text;
        }
        chatHistory.push(userMessageObj);

        let existingSession = allSessions.find(s => s.id === currentSessionId);
        if (!existingSession) {
          existingSession = {
            id: currentSessionId,
            title: text.substring(0, 24) || "Image Chat",
            history: chatHistory
          };
          allSessions.unshift(existingSession);
        } else {
          existingSession.history = chatHistory;
        }
        saveAllSessions();

        input.value = '';
        input.style.height = 'auto';
        removeSelectedImage();
      }

      isGenerating = true;
      updateSendBtn();

      const container = document.getElementById('chat-container');
      const imageKeywords = ['draw', 'generate image', 'create image', 'picture of', 'image of', 'illustrate', 'paint', 'sketch', 'make image', 'make an image'];
      const lastUserContent = chatHistory[chatHistory.length - 1]?.content;
      const lastUserText = typeof lastUserContent === 'string' ? lastUserContent : (lastUserContent?.find?.(c => c.type === 'text')?.text || '');
      const isImageRequest = !imageToSend && imageKeywords.some(kw => lastUserText.toLowerCase().includes(kw));

      let loadingMsgDiv = document.createElement('div');
      loadingMsgDiv.className = 'message assistant';

      if (isImageRequest) {
        loadingMsgDiv.innerHTML = '<div style="color:#a78bfa;font-style:italic;">🎨 Generating your image... please wait (10-20 seconds)</div>';
      } else {
        loadingMsgDiv.innerHTML = `
          <div class="loading-dots">
            <span></span><span></span><span></span>
          </div>
        `;
      }
      container.appendChild(loadingMsgDiv);
      container.scrollTop = container.scrollHeight;

      currentAbortController = new AbortController();
      const timeout = setTimeout(() => currentAbortController.abort(), 60000);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            history: chatHistory,
            user_email: currentUserEmail,
            think: isThinkActive
          }),
          signal: currentAbortController.signal
        });

        clearTimeout(timeout);
        const data = await res.json();
        const replyText = data.reply || "No response received.";

        if (loadingMsgDiv.parentNode) loadingMsgDiv.remove();

        addMessageToUI('assistant', replyText, null, true);
        chatHistory.push({ role: "assistant", content: replyText });

        const existingSession = allSessions.find(s => s.id === currentSessionId);
        if (existingSession) {
          existingSession.history = chatHistory;
          saveAllSessions();
        }

      } catch (err) {
        if (loadingMsgDiv.parentNode) loadingMsgDiv.remove();
        if (err.name === 'AbortError') {
          addMessageToUI('assistant', "⏹️ Stopped by user.");
        } else {
          addMessageToUI('assistant', "⚠️ Error connecting to server. Please try again.");
        }
      } finally {
        isGenerating = false;
        currentAbortController = null;
        updateSendBtn();
      }
    }

    // ===== KEYBOARD SHORTCUTS =====
    document.addEventListener('keydown', (e) => {
      const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
      const cmdOrCtrl = isMac ? e.metaKey : e.ctrlKey;
      const input = document.getElementById('user-input');

      if (cmdOrCtrl && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        input.focus();
        return;
      }
      if (cmdOrCtrl && e.key.toLowerCase() === 'n') {
        e.preventDefault();
        createNewChat();
        input.focus();
        return;
      }
      if (cmdOrCtrl && e.shiftKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        const assistantMessages = document.querySelectorAll('.message.assistant');
        if (assistantMessages.length > 0) {
          const last = assistantMessages[assistantMessages.length - 1];
          const text = last.innerText.replace(/🔊 Listen.*$/s, '').replace(/Regenerate$/,'').trim();
          navigator.clipboard.writeText(text).then(() => {
            const toast = document.createElement('div');
            toast.textContent = '✅ Copied last reply';
            toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#7c3aed;color:white;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(124,58,237,0.5);';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1800);
          });
        }
        return;
      }
      if (cmdOrCtrl && e.key === '/') {
        e.preventDefault();
        alert(
          '⌨️ MAZ AI Shortcuts\n\n' +
          'Ctrl/Cmd + K — Focus input\n' +
          'Ctrl/Cmd + N — New chat\n' +
          'Ctrl/Cmd + Shift + C — Copy last reply\n' +
          'Ctrl/Cmd + / — This menu\n' +
          'Enter — Send message\n' +
          'Shift + Enter — New line\n' +
          'Esc — Clear input'
        );
        return;
      }
      if (e.key === 'Escape') {
        const sidebar = document.getElementById('sidebar');
        if (!sidebar.classList.contains('closed')) {
          toggleSidebar();
          return;
        }
        if (document.activeElement === input && input.value) {
          input.value = '';
          input.style.height = 'auto';
          removeSelectedImage();
        }
      }
    });
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MAZ AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0b0e;
      color: #e2e8f0;
      height: 100vh;
      height: 100dvh; /* Handles mobile browser bars properly */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Header Styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #121218;
      border-bottom: 1px solid #1e1e2d;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .brand {
      font-weight: 700;
      font-size: 18px;
      color: #a855f7;
    }

    .theme-btn {
      background: #1e1e2d;
      border: 1px solid #2d2d3f;
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    /* Chat Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .welcome-screen {
      margin: auto;
      text-align: center;
    }

    .welcome-screen h1 {
      font-size: 28px;
      color: #a855f7;
      margin-bottom: 8px;
    }

    .welcome-screen p {
      color: #94a3b8;
      font-size: 14px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: #8b5cf6;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background-color: #1a1a24;
      border: 1px solid #272738;
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    /* Footer & Input Box */
    footer {
      padding: 12px;
      background-color: #0b0b0e;
      border-top: 1px solid #1a1a24;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background-color: #121218;
      border: 1px solid #272738;
      border-radius: 10px;
      padding: 4px 6px 4px 12px;
      gap: 8px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: #8b5cf6;
    }

    /* Fixed input attributes to stop credit card & password autofill popups */
    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px; /* Prevents auto-zoom on mobile */
      padding: 8px 0;
      transition: color 0.3s ease;
    }

    .send-btn {
      background-color: #8b5cf6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .send-btn:hover {
      background-color: #7c3aed;
    }

    /* Light Mode Styles */
    body.light-mode {
      background-color: #f8fafc;
      color: #0f172a;
    }

    body.light-mode header,
    body.light-mode footer {
      background-color: #ffffff;
      border-color: #e2e8f0;
    }

    body.light-mode .theme-btn {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #0f172a;
    }

    body.light-mode .input-wrapper {
      background-color: #ffffff;
      border-color: #cbd5e1;
    }

    body.light-mode input[type="text"] {
      color: #0f172a;
    }

    body.light-mode .message.assistant {
      background-color: #ffffff;
      border-color: #e2e8f0;
      color: #0f172a;
    }

    body.light-mode .welcome-screen p {
      color: #64748b;
    }

    /* Responsive scaling for mobile screens */
    @media (max-width: 480px) {
      .brand { font-size: 16px; }
      .theme-btn { font-size: 11px; padding: 4px 8px; }
      .message { max-width: 90%; font-size: 13.5px; }
      footer { padding: 8px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">MAZ AI</div>
    <button class="theme-btn" id="theme-toggle">☀️ / 🌙 Theme</button>
  </header>

  <div id="chat-container">
    <div class="welcome-screen" id="welcome">
      <h1>MAZ AI</h1>
      <p>How can I help you today?</p>
    </div>
  </div>

  <footer>
    <div class="input-wrapper">
      <input 
        type="text" 
        id="user-input" 
        name="chat-message"
        placeholder="Type your message..." 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="sentences"
        spellcheck="false"
        onkeydown="if(event.key==='Enter') sendMessage()"
      />
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const welcomeScreen = document.getElementById('welcome');
    const themeToggleBtn = document.getElementById('theme-toggle');

    // Theme Toggle Functionality
    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      if (document.body.classList.contains('light-mode')) {
        themeToggleBtn.textContent = '🌙 Dark Mode';
      } else {
        themeToggleBtn.textContent = '☀️ Light Mode';
      }
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (welcomeScreen) welcomeScreen.style.display = 'none';

      appendMessage('user', text);
      userInput.value = '';

      const loadingDiv = appendMessage('assistant', 'Thinking...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        loadingDiv.textContent = data.reply || "No response received.";
      } catch (err) {
        loadingDiv.textContent = "Error connecting to server.";
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }
  </script>
</body>
</html>

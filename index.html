<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZ AI - Code Runner Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1e293b; padding: 16px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #334155; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; font-size: 0.95rem; }
    .user-msg { align-self: flex-end; background-color: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .agent-msg { align-self: flex-start; background-color: #334155; color: #f8fafc; border-bottom-left-radius: 2px; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; }
    footer { padding: 12px; background-color: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    button { padding: 12px 20px; background-color: #2563eb; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

  <header>⚡ MAZ AI Code Runner (Muhammad Ali Zahid)</header>

  <div id="chat-box">
    <div class="message agent-msg">Hello! I am MAZ AI. Ask me to write or execute code in Python, JavaScript, C++, or C.</div>
  </div>

  <footer>
    <input type="text" id="user-input" placeholder="e.g., Run python code to print 2^8..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const text = input.value.trim();
      if (!text) return;

      // Add user message to UI
      chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Add loading state
      const loadingId = 'loading-' + Date.now();
      chatBox.innerHTML += `<div class="message agent-msg" id="${loadingId}">MAZ AI is thinking and running code...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        document.getElementById(loadingId).innerText = data.reply;
      } catch (err) {
        document.getElementById(loadingId).innerText = "Error connecting to backend server.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>

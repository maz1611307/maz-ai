<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MAZ AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0b0e;
      color: #e2e8f0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #121218;
      border-bottom: 1px solid #1e1e2d;
    }

    .brand {
      font-weight: 700;
      font-size: 18px;
      color: #a855f7;
    }

    .theme-btn {
      background: #1e1e2d;
      border: 1px solid #2d2d3f;
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .welcome-screen {
      margin: auto;
      text-align: center;
    }

    .welcome-screen h1 {
      font-size: 28px;
      color: #a855f7;
      margin-bottom: 8px;
    }

    .welcome-screen p {
      color: #94a3b8;
      font-size: 14px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: #8b5cf6;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background-color: #1a1a24;
      border: 1px solid #272738;
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
    }

    .chat-img-preview {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: block;
    }

    footer {
      padding: 12px;
      background-color: #0b0b0e;
      border-top: 1px solid #1a1a24;
    }

    #image-preview-container {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #121218;
      border: 1px solid #272738;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    #image-preview-container img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
    }

    .remove-img-btn {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background-color: #121218;
      border: 1px solid #272738;
      border-radius: 10px;
      padding: 4px 6px 4px 8px;
      gap: 8px;
    }

    /* Plus (+) Button Styling */
    .add-file-btn {
      background: #1e1e2d;
      border: 1px solid #2d2d3f;
      color: #a855f7;
      font-size: 20px;
      font-weight: bold;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .add-file-btn:hover {
      background-color: #8b5cf6;
      color: #ffffff;
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      padding: 8px 0;
    }

    .send-btn {
      background-color: #8b5cf6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    body.light-mode { background-color: #f8fafc; color: #0f172a; }
    body.light-mode header, body.light-mode footer { background-color: #ffffff; border-color: #e2e8f0; }
    body.light-mode .input-wrapper, body.light-mode #image-preview-container { background-color: #ffffff; border-color: #cbd5e1; }
    body.light-mode .add-file-btn { background-color: #f1f5f9; border-color: #cbd5e1; }
    body.light-mode input[type="text"] { color: #0f172a; }
    body.light-mode .message.assistant { background-color: #ffffff; border-color: #e2e8f0; color: #0f172a; }
  </style>
</head>
<body>

  <header>
    <div class="brand">MAZ AI</div>
    <button class="theme-btn" id="theme-toggle">☀️ / 🌙 Theme</button>
  </header>

  <div id="chat-container">
    <div class="welcome-screen" id="welcome">
      <h1>MAZ AI</h1>
      <p>How can I help you today?</p>
    </div>
  </div>

  <footer>
    <div id="image-preview-container">
      <img id="preview-img" src="" alt="preview" />
      <span style="font-size: 12px; color: #94a3b8;">File attached</span>
      <button class="remove-img-btn" onclick="clearImageAttachment()">✕</button>
    </div>
    <div class="input-wrapper">
      <!-- Plus Button -->
      <button class="add-file-btn" onclick="document.getElementById('file-input').click()" title="Add file or image">+</button>
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)" />
      
      <input 
        type="text" 
        id="user-input" 
        name="chat-message"
        placeholder="Type a message or paste an image..." 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="sentences"
        spellcheck="false"
        onkeydown="if(event.key==='Enter') sendMessage()"
      />
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const welcomeScreen = document.getElementById('welcome');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const previewContainer = document.getElementById('image-preview-container');
    const previewImg = document.getElementById('preview-img');

    let currentBase64Image = null;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) processImageFile(file);
    }

    document.addEventListener('paste', (event) => {
      const items = (event.clipboardData || event.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          processImageFile(blob);
        }
      }
    });

    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        currentBase64Image = e.target.result;
        previewImg.src = currentBase64Image;
        previewContainer.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImageAttachment() {
      currentBase64Image = null;
      previewImg.src = '';
      previewContainer.style.display = 'none';
      document.getElementById('file-input').value = '';
    }

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      themeToggleBtn.textContent = document.body.classList.contains('light-mode') ? '🌙 Dark Mode' : '☀️ Light Mode';
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text && !currentBase64Image) return;

      if (welcomeScreen) welcomeScreen.style.display = 'none';

      const userMessageDiv = appendMessage('user', text);
      if (currentBase64Image) {
        const imgElem = document.createElement('img');
        imgElem.src = currentBase64Image;
        imgElem.className = 'chat-img-preview';
        userMessageDiv.prepend(imgElem);
      }

      const sentImage = currentBase64Image;
      userInput.value = '';
      clearImageAttachment();

      const loadingDiv = appendMessage('assistant', 'Thinking...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, image: sentImage })
        });
        const data = await res.json();
        loadingDiv.textContent = data.reply || "No response received.";
      } catch (err) {
        loadingDiv.textContent = "Error connecting to server.";
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }
  </script>
</body>
</html>

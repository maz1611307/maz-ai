<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MAZ AI</title>

  <!-- Round Purple M Tab Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23120924' stroke='%238b5cf6' stroke-width='4'/><path d='M 22 68 C 22 68 20 32 30 26 C 38 20 42 58 48 58 C 54 58 56 28 66 26 C 74 24 76 68 82 66' stroke='%23c084fc' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M 22 68 C 22 68 20 32 30 26 C 38 20 42 58 48 58 C 54 58 56 28 66 26 C 74 24 76 68 82 66' stroke='%23f3e8ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />

  <!-- Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- JWT Decoder Library -->
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body { background-color: #0f0f13; color: #e2e8f0; height: 100vh; display: flex; overflow: hidden; }

    /* Login Screen Overlay */
    #login-overlay {
      position: fixed; inset: 0; background-color: #0f0f13;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; gap: 20px;
    }
    .login-card {
      background: #120d1d; border: 1px solid #4c1d95; padding: 40px; border-radius: 20px;
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    /* Main App Layout */
    .app-container { display: flex; width: 100vw; height: 100vh; }

    .sidebar {
      width: 260px; background-color: #120d1d; border-right: 1px solid #2e2342;
      display: flex; flex-direction: column; padding: 16px; gap: 16px;
    }

    .new-chat-btn {
      background-color: #7c3aed; color: white; border: none; border-radius: 12px;
      padding: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .new-chat-btn:hover { background-color: #6d28d9; }

    .history-title { font-size: 11px; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

    .history-item {
      padding: 10px 12px; border-radius: 8px; background-color: #1a1625; color: #cbd5e1;
      cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item:hover, .history-item.active { background-color: #271f38; color: #f3e8ff; border: 1px solid #581c87; }

    .user-profile {
      padding-top: 10px; border-top: 1px solid #2e2342; display: flex; align-items: center;
      justify-content: space-between; font-size: 13px; color: #cbd5e1;
    }
    .logout-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; }

    /* Main Workspace */
    .main-workspace { flex: 1; display: flex; flex-direction: column; height: 100%; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; color: #c084fc; }

    #chat-container {
      flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column;
      gap: 20px; max-width: 850px; width: 100%; margin: 0 auto;
    }

    .message.user { align-self: flex-end; background-color: #2a1b4e; color: #f3e8ff; border: 1px solid #581c87; padding: 10px 18px; border-radius: 22px; max-width: 80%; font-size: 15px; }
    .message.assistant { align-self: flex-start; color: #e2e8f0; padding: 4px 0; width: 100%; font-size: 15px; line-height: 1.6; }

    footer { padding: 12px 16px 20px 16px; max-width: 850px; width: 100%; margin: 0 auto; }
    .input-card { display: flex; flex-direction: column; background-color: #1a1625; border: 1px solid #4c1d95; border-radius: 24px; padding: 10px 14px; gap: 8px; }
    .input-row { display: flex; align-items: center; gap: 10px; }
    input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: #f3e8ff; font-size: 15px; }

    .actions-row { display: flex; align-items: center; justify-content: space-between; }
    .actions-left { display: flex; align-items: center; gap: 8px; }
    .add-file-btn { background: transparent; border: none; color: #c084fc; font-size: 24px; cursor: pointer; }
    .think-btn { display: flex; align-items: center; gap: 6px; background-color: #271f38; border: 1px solid #4c1d95; color: #d8b4fe; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .think-btn.active { background-color: #7c3aed; color: white; }
    .send-arrow-btn { background-color: #8b5cf6; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-overlay">
    <div class="login-card">
      <h2 style="color: #c084fc;">Welcome to MAZ AI</h2>
      <p style="color: #94a3b8; font-size: 14px;">Sign in with Google to access your private chats</p>
      
      <!-- GOOGLE LOGIN BUTTON (Replace client_id with your real Google Client ID) -->
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
    </div>
  </div>

  <!-- Main App Layout -->
  <div class="app-container">
    <aside class="sidebar">
      <button class="new-chat-btn" onclick="createNewChat()">
        <span>+</span> New Chat
      </button>
      
      <div class="history-title">YOUR RECENT CHATS</div>
      <div class="history-list" id="history-list"></div>

      <div class="user-profile">
        <span id="user-display-email">User</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main-workspace">
      <header>
        <div class="brand">
          <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" fill="#120924" stroke="#8b5cf6" stroke-width="4"/>
            <path d="M 22 68 C 22 68 20 32 30 26 C 38 20 42 58 48 58 C 54 58 56 28 66 26 C 74 24 76 68 82 66" stroke="#c084fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>MAZ AI</span>
        </div>
      </header>

      <div id="chat-container"></div>

      <footer>
        <div class="input-card">
          <div class="input-row">
            <input type="text" id="user-input" placeholder="Ask MAZ AI..." onkeydown="if(event.key==='Enter') sendMessage()" />
          </div>
          <div class="actions-row">
            <div class="actions-left">
              <button class="add-file-btn" title="Add file">+</button>
              <button class="think-btn" id="think-toggle" onclick="toggleThink()">
                🧠 <span>Think</span>
              </button>
            </div>
            <button class="send-arrow-btn" onclick="sendMessage()">↑</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script>
    let currentUserEmail = localStorage.getItem('maz_user_email') || null;
    let chats = {}; 
    let activeChatId = null;
    let isThinkActive = false;

    // Check if user is already logged in
    if (currentUserEmail) {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('user-display-email').textContent = currentUserEmail;
      loadUserChats();
    }

    // Google Auth Callback
    function handleCredentialResponse(response) {
      const responsePayload = jwt_decode(response.credential);
      currentUserEmail = responsePayload.email;
      localStorage.setItem('maz_user_email', currentUserEmail);
      
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('user-display-email').textContent = currentUserEmail;
      loadUserChats();
    }

    function logout() {
      localStorage.removeItem('maz_user_email');
      location.reload();
    }

    function toggleThink() {
      isThinkActive = !isThinkActive;
      document.getElementById('think-toggle').classList.toggle('active', isThinkActive);
    }

    async function loadUserChats() {
      if (!currentUserEmail) return;

      try {
        const res = await fetch(`/api/chat?user_email=${encodeURIComponent(currentUserEmail)}`);
        const data = await res.json();
        
        chats = {};
        if (data.messages) {
          data.messages.forEach(msg => {
            const chatId = msg.chat_id || 'default_chat';
            if (!chats[chatId]) {
              chats[chatId] = { title: msg.chat_title || 'Chat', messages: [] };
            }
            chats[chatId].messages.push({ role: msg.role, text: msg.content });
          });
        }

        renderSidebar();
        const chatKeys = Object.keys(chats);
        if (chatKeys.length > 0) {
          activeChatId = chatKeys[chatKeys.length - 1];
          renderMessages();
        } else {
          createNewChat();
        }
      } catch (err) {
        console.error("Failed to load user chats", err);
      }
    }

    function createNewChat() {
      activeChatId = 'chat_' + Date.now();
      chats[activeChatId] = { title: 'New Chat', messages: [] };
      renderSidebar();
      renderMessages();
    }

    function renderSidebar() {
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      Object.keys(chats).reverse().forEach(id => {
        const item = document.createElement('div');
        item.className = `history-item ${id === activeChatId ? 'active' : ''}`;
        item.textContent = chats[id].title || 'Untitled Chat';
        item.onclick = () => { activeChatId = id; renderSidebar(); renderMessages(); };
        list.appendChild(item);
      });
    }

    function renderMessages() {
      const container = document.getElementById('chat-container');
      container.innerHTML = '';
      if (!activeChatId || !chats[activeChatId]) return;

      chats[activeChatId].messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = `message ${msg.role}`;
        div.textContent = msg.text;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text || !currentUserEmail) return;

      if (!activeChatId) createNewChat();

      if (chats[activeChatId].messages.length === 0) {
        chats[activeChatId].title = text.slice(0, 25) + '...';
      }

      chats[activeChatId].messages.push({ role: 'user', text });
      input.value = '';
      renderSidebar();
      renderMessages();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            user_email: currentUserEmail,
            chat_id: activeChatId,
            chat_title: chats[activeChatId].title,
            think: isThinkActive
          })
        });
        const data = await res.json();
        chats[activeChatId].messages.push({ role: 'assistant', text: data.reply || "No response." });
      } catch (err) {
        chats[activeChatId].messages.push({ role: 'assistant', text: "Error connecting to server." });
      }

      renderMessages();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MAZ AI</title>
  
  <!-- Green Neon M Tab Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><g stroke='%2339ff14' fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M 30,55 C 20,55 20,40 30,35 C 40,30 45,50 40,65 C 38,72 38,25 42,20 C 44,18 45,20 45,28 C 45,35 48,25 55,22 C 65,18 75,30 80,65 C 82,72 85,73 88,72' stroke-width='8'/><path d='M 30,55 C 20,55 20,40 30,35 C 40,30 45,50 40,65 C 38,72 38,25 42,20 C 44,18 45,20 45,28 C 45,35 48,25 55,22 C 65,18 75,30 80,65 C 82,72 85,73 88,72' stroke='black' stroke-width='1.5'/></g></svg>" />

  <style>
    /* Your CSS code */
  </style>
</head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f0f13;
      color: #e2e8f0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background-color: transparent;
    }

    .brand {
      font-weight: 700;
      font-size: 20px;
      color: #c084fc;
      letter-spacing: 0.5px;
    }

    .theme-btn {
      background: #1e1e2d;
      border: 1px solid #3b2d54;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    .welcome-screen {
      margin: auto;
      text-align: center;
    }

    .welcome-screen h1 {
      font-size: 32px;
      color: #c084fc;
      margin-bottom: 8px;
    }

    .welcome-screen p {
      color: #94a3b8;
      font-size: 15px;
    }

    /* User Message */
    .message.user {
      align-self: flex-end;
      background-color: #2a1b4e;
      color: #f3e8ff;
      border: 1px solid #581c87;
      padding: 10px 18px;
      border-radius: 22px;
      max-width: 80%;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    /* Gemini-Style AI Message */
    .message.assistant {
      align-self: flex-start;
      background: transparent;
      border: none;
      color: #e2e8f0;
      padding: 4px 0;
      width: 100%;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .chat-img-preview {
      max-width: 280px;
      max-height: 280px;
      border-radius: 14px;
      margin-bottom: 8px;
      display: block;
    }

    footer {
      padding: 12px 16px 20px 16px;
      background-color: transparent;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    /* Unified Chat Container Box */
    .input-card {
      display: flex;
      flex-direction: column;
      background-color: #1a1625;
      border: 1px solid #4c1d95;
      border-radius: 24px;
      padding: 12px;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.15);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-card:focus-within {
      border-color: #8b5cf6;
      box-shadow: 0 4px 24px rgba(139, 92, 246, 0.3);
    }

    /* Image Preview Strip inside Chat Box */
    #image-preview-container {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 8px 4px;
    }

    .preview-img-wrapper {
      position: relative;
      display: inline-block;
    }

    .preview-img-wrapper img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid #581c87;
    }

    .remove-img-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Plus Button Without Border */
    .add-file-btn {
      background: transparent;
      border: none;
      color: #c084fc;
      font-size: 26px;
      font-weight: 300;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s ease;
    }

    .add-file-btn:active {
      transform: scale(0.9);
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f3e8ff;
      font-size: 15px;
      padding: 4px 0;
    }

    input[type="text"]::placeholder {
      color: #94a3b8;
    }

    .send-btn {
      background-color: #7c3aed;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background-color: #6d28d9;
    }

    body.light-mode { background-color: #f8fafc; color: #0f172a; }
    body.light-mode header, body.light-mode footer { background-color: transparent; }
    body.light-mode .input-card { background-color: #ffffff; border-color: #c084fc; box-shadow: 0 4px 16px rgba(192, 132, 252, 0.2); }
    body.light-mode input[type="text"] { color: #0f172a; }
    body.light-mode .add-file-btn { color: #7e22ce; }
    body.light-mode .message.assistant { color: #0f172a; }
    body.light-mode .message.user { background-color: #7e22ce; color: #ffffff; border-color: #6b21a8; }
  </style>
</head>
<body>

  <header>
    <div class="brand">MAZ AI</div>
    <button class="theme-btn" id="theme-toggle">☀️ / 🌙 Theme</button>
  </header>

  <div id="chat-container">
    <div class="welcome-screen" id="welcome">
      <h1>MAZ AI</h1>
      <p>How can I help you today?</p>
    </div>
  </div>

  <footer>
    <div class="input-card">
      <div id="image-preview-container">
        <div class="preview-img-wrapper">
          <img id="preview-img" src="" alt="preview" />
          <button class="remove-img-btn" onclick="clearImageAttachment()">✕</button>
        </div>
      </div>
      
      <div class="input-row">
        <button class="add-file-btn" onclick="document.getElementById('file-input').click()" title="Add file or image">+</button>
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)" />
        
        <input 
          type="text" 
          id="user-input" 
          name="chat-message"
          placeholder="Ask MAZ AI..." 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="sentences"
          spellcheck="false"
          onkeydown="if(event.key==='Enter') sendMessage()"
        />
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const welcomeScreen = document.getElementById('welcome');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const previewContainer = document.getElementById('image-preview-container');
    const previewImg = document.getElementById('preview-img');

    let currentBase64Image = null;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) processImageFile(file);
    }

    document.addEventListener('paste', (event) => {
      const items = (event.clipboardData || event.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          processImageFile(blob);
        }
      }
    });

    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        currentBase64Image = e.target.result;
        previewImg.src = currentBase64Image;
        previewContainer.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImageAttachment() {
      currentBase64Image = null;
      previewImg.src = '';
      previewContainer.style.display = 'none';
      document.getElementById('file-input').value = '';
    }

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      themeToggleBtn.textContent = document.body.classList.contains('light-mode') ? '🌙 Dark Mode' : '☀️ Light Mode';
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text && !currentBase64Image) return;

      if (welcomeScreen) welcomeScreen.style.display = 'none';

      const userMessageDiv = appendMessage('user', text);
      if (currentBase64Image) {
        const imgElem = document.createElement('img');
        imgElem.src = currentBase64Image;
        imgElem.className = 'chat-img-preview';
        userMessageDiv.prepend(imgElem);
      }

      const sentImage = currentBase64Image;
      userInput.value = '';
      clearImageAttachment();

      const loadingDiv = appendMessage('assistant', 'Thinking...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, image: sentImage })
        });
        const data = await res.json();
        loadingDiv.textContent = data.reply || "No response received.";
      } catch (err) {
        loadingDiv.textContent = "Error connecting to server.";
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }
  </script>
</body>
</html>

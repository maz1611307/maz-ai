<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZ AI</title>
  <!-- Marked.js for rendering markdown formatted text cleanly -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #08080c;
      --card-bg: #12121a;
      --text-color: #f8fafc;
      --msg-ai-bg: #1a1a26;
      --msg-user-bg: #8b5cf6;
      --border-color: #2e2a4a;
      --input-bg: #0d0d14;
      --purple-glow: rgba(139, 92, 246, 0.35);
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --msg-ai-bg: #e2e8f0;
      --msg-user-bg: #7c3aed;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
      --purple-glow: rgba(124, 58, 237, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; transition: background-color 0.3s, color 0.3s; }
    
    header { 
      background-color: var(--card-bg); 
      padding: 12px 20px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      min-height: 65px; /* Keeps header height consistent */
    }

    /* Standard header layout (collapsed) */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* Target logo in the brand area (collapsed view) */
    .brand img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Messaging Area - Transition behavior */
    #chat-box { 
      flex: 1; 
      overflow-y: auto; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 14px;
      transition: all 0.5s ease-in-out;
    }
    
    /* When messaging begins, chat-box collapses towards the top */
    #chat-box.active {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    /* Welcome/Startup layout (Image 3 behavior) */
    #chat-box.startup {
      justify-content: center;
      align-items: center;
      padding: 0;
      text-align: center;
    }

    /* Welcoming Area inside startup */
    .welcome-prompt {
      display: none; /* Hidden by default */
    }

    #chat-box.startup .welcome-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: -100px; /* Centers it vertically */
    }

    #chat-box.startup .startup-logo {
      width: 140px;
      height: 140px;
      box-shadow: 0 0 35px var(--purple-glow);
      border-radius: 20px;
    }

    #chat-box.startup h1 {
      font-size: 2.2rem;
      margin-top: 10px;
      font-weight: 700;
    }

    /* Hide standard chat messages in startup view */
    #chat-box.startup .message, 
    #chat-box.startup .agent-greeting {
      display: none;
    }

    /* Agent greeting will be visible in active mode */
    #chat-box.active .agent-greeting {
      display: flex;
    }

    .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; font-size: 0.95rem; }
    .user-msg { align-self: flex-end; background-color: var(--msg-user-bg); color: #ffffff; border-bottom-right-radius: 2px; }
    .agent-msg { align-self: flex-start; background-color: var(--msg-ai-bg); color: var(--text-color); border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }
    
    /* Formatting Markdown Elements inside AI answers */
    .agent-msg p { margin-bottom: 8px; }
    .agent-msg p:last-child { margin-bottom: 0; }
    .agent-msg table { border-collapse: collapse; width: 100%; margin: 10px 0; background: rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden; }
    .agent-msg th, .agent-msg td { border: 1px solid var(--border-color); padding: 8px 12px; text-align: left; }
    .agent-msg th { background-color: rgba(139, 92, 246, 0.2); }
    .agent-msg code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    .agent-msg pre { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border-color); }

    footer { padding: 16px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); }
    
    /* Purple Glowing Container for Input */
    .input-wrapper {
      display: flex;
      gap: 8px;
      background: var(--input-bg);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 0 15px var(--purple-glow);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: #8b5cf6;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.6);
    }

    input { flex: 1; padding: 10px 14px; border: none; background: transparent; color: var(--text-color); font-size: 1rem; outline: none; }
    button.send-btn { padding: 10px 20px; background-color: #8b5cf6; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button.send-btn:hover { background-color: #7c3aed; }
  </style>
</head>
<body onload="initializeChat()">

  <header>
    <div class="brand">
      <!-- Your new custom purple logo (maz-logo-purple.png) -->
      <img src="https://i.ibb.co/5Kq3jFj/maz-logo-purple.png" id="ai-logo" alt="MAZ AI Logo">
      <span>MAZ AI</span>
    </div>
    <button class="theme-toggle-btn" onclick="toggleTheme()">☀️ / 🌙 Theme</button>
  </header>

  <!-- chat-box starts with 'startup' class to show central layout -->
  <div id="chat-box" class="startup">
    
    <!-- Central welcome layout for startup (Image 3) -->
    <div class="welcome-prompt">
      <img src="https://i.ibb.co/5Kq3jFj/maz-logo-purple.png" class="startup-logo" alt="MAZ AI Logo Big">
      <h1>MAZ AI</h1>
      <p>How can I help you today?</p>
    </div>

    <!-- The agent's standard chat greeting, shown in active mode -->
    <div class="message agent-msg agent-greeting">Hello! I am MAZ AI. How can I help you today?</div>
  </div>

  <footer>
    <div class="input-wrapper">
      <input type="text" id="user-input" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </footer>

  <script>
    function initializeChat() {
      // Ensure page is fresh in startup mode
      document.getElementById('chat-box').className = 'startup';
    }

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'light');
      }
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const text = input.value.trim();
      if (!text) return;

      // When messaging begins: collapse the startup view into chat view
      if (chatBox.classList.contains('startup')) {
        chatBox.classList.remove('startup');
        chatBox.classList.add('active');
      }

      // 1. User Message
      chatBox.innerHTML += `<div class="message user-msg">${escapeHtml(text)}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // 2. Loading state
      const loadingId = 'loading-' + Date.now();
      chatBox.innerHTML += `<div class="message agent-msg" id="${loadingId}">MAZ AI is thinking...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      // 3. API Call (Replace with your server URL)
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        
        // 4. Update with markdown answer
        document.getElementById(loadingId).innerHTML = marked.parse(data.reply);
      } catch (err) {
        document.getElementById(loadingId).innerText = "Error connecting to backend server.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MAZ AI</title>

  <!-- Round Purple M Tab Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23120924' stroke='%238b5cf6' stroke-width='4'/><path d='M 22 68 C 22 68 20 32 30 26 C 38 20 42 58 48 58 C 54 58 56 28 66 26 C 74 24 76 68 82 66' stroke='%23c084fc' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M 22 68 C 22 68 20 32 30 26 C 38 20 42 58 48 58 C 54 58 56 28 66 26 C 74 24 76 68 82 66' stroke='%23f3e8ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />

  <!-- Google Identity Services & JWT Decoder -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

  <!-- Highlight.js CSS & JS for Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body { background-color: #0f0f13; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Login Screen Overlay */
    #login-overlay {
      position: fixed; inset: 0; background-color: #0f0f13;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; gap: 20px;
    }
    .login-card {
      background: #120d1d; border: 1px solid #4c1d95; padding: 40px; border-radius: 20px;
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    /* Main Workspace */
    .main-workspace { flex: 1; display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #2e2342; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; color: #c084fc; }

    .top-new-chat-btn {
      background-color: #7c3aed; color: white; border: none; width: 40px; height: 40px;
      border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-weight: 300; transition: background 0.2s;
    }
    .top-new-chat-btn:hover { background-color: #6d28d9; }

    #chat-container {
      flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column;
      gap: 20px; max-width: 850px; width: 100%; margin: 0 auto;
      scrollbar-width: thin;
      scrollbar-color: #3b2164 #0f0f13;
    }

    #chat-container::-webkit-scrollbar { width: 6px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }
    #chat-container::-webkit-scrollbar-thumb { background: #3b2164; border-radius: 10px; }
    #chat-container::-webkit-scrollbar-thumb:hover { background: #7c3aed; }

    .welcome-placeholder {
      margin: auto; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: 12px; user-select: none;
    }
    .welcome-placeholder h1 { font-size: 32px; font-weight: 700; color: #c084fc; letter-spacing: 0.5px; }
    .welcome-placeholder p { font-size: 15px; color: #94a3b8; }

    .message.user { align-self: flex-end; background-color: #2a1b4e; color: #f3e8ff; border: 1px solid #581c87; padding: 10px 18px; border-radius: 22px; max-width: 80%; font-size: 15px; }
    .message.assistant { align-self: flex-start; color: #e2e8f0; padding: 4px 0; width: 100%; font-size: 15px; line-height: 1.6; position: relative; }

    .message.assistant strong, .message.assistant b { color: #c084fc; font-weight: 600; }
    .message.assistant ul { margin: 6px 0 6px 20px; padding: 0; }
    .message.assistant li { margin-bottom: 4px; }
    .message.assistant code:not(.code-table code) { background-color: #271f38; color: #d8b4fe; padding: 2px 6px; border-radius: 6px; font-size: 13px; }

    /* Code Block Styling */
    .code-block-wrapper {
      background-color: #1e1e24;
      border: 1px solid #322d48;
      border-radius: 10px;
      margin: 12px 0;
      overflow: hidden;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #18181c;
      padding: 8px 14px;
      border-bottom: 1px solid #2e2840;
      font-size: 13px;
      color: #94a3b8;
    }

    .code-copy-btn {
      background-color: #2e2840;
      color: #e2e8f0;
      border: 1px solid #4c3b6e;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .code-copy-btn:hover { background-color: #4c1d95; }

    .code-scroll-area {
      overflow-x: auto;
      padding: 10px 0;
    }

    .code-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
      line-height: 1.5;
    }

    .code-table td {
      padding: 0;
      vertical-align: top;
    }

    .line-numbers {
      user-select: none;
      text-align: right;
      color: #4a5568;
      padding-right: 14px;
      padding-left: 12px;
      border-right: 1px solid #2d2d38;
      width: 40px;
    }

    .code-content {
      padding-left: 14px;
      padding-right: 14px;
      white-space: pre;
      color: #abb2bf;
    }

    .speak-btn {
      background: transparent; border: none; color: #a78bfa; cursor: pointer;
      font-size: 16px; margin-top: 6px; display: inline-flex; align-items: center; gap: 4px;
    }
    .speak-btn:hover { color: #c084fc; }

    .chat-img { max-width: 250px; max-height: 250px; border-radius: 12px; display: block; margin-bottom: 8px; border: 1px solid #7c3aed; object-fit: cover; }

    footer { padding: 12px 16px 16px 16px; max-width: 850px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .input-card { display: flex; flex-direction: column; background-color: #1a1625; border: 1px solid #4c1d95; border-radius: 24px; padding: 10px 14px; gap: 8px; }

    #image-preview-container { display: none; position: relative; width: fit-content; margin-bottom: 4px; }
    #image-preview { max-width: 90px; max-height: 90px; border-radius: 10px; border: 1px solid #7c3aed; object-fit: cover; }
    #remove-image-btn { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .input-row { display: flex; align-items: center; gap: 10px; }
    input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: #f3e8ff; font-size: 15px; }

    .actions-row { display: flex; align-items: center; justify-content: space-between; }
    .actions-left { display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: transparent; border: none; color: #c084fc; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .icon-btn svg { fill: currentColor; }
    .icon-btn.recording { color: #ef4444; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .think-btn { display: flex; align-items: center; gap: 6px; background-color: #271f38; border: 1px solid #4c1d95; color: #d8b4fe; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .think-btn.active { background-color: #7c3aed; color: white; }

    .send-arrow-btn { 
      background-color: #8b5cf6; color: white; border: none; width: 36px; height: 36px; 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      cursor: pointer; font-size: 18px; line-height: 1;
    }
    .send-arrow-btn:hover { background-color: #7c3aed; }

    .disclaimer-text {
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-overlay">
    <div class="login-card">
      <h2 style="color: #c084fc;">Welcome to MAZ AI</h2>
      <p style="color: #94a3b8; font-size: 14px;">Sign in with Google to use MAZ AI</p>
      <div id="g_id_onload"
           data-client_id="38665812589-0h1ouegqmkh9ug7fehlj5seudglhf5rs.apps.googleusercontent.com"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
    </div>
  </div>

  <div class="main-workspace">
    <header>
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#120924" stroke="#8b5cf6" stroke-width="4"/>
          <path d="M 22 68 C 22 68 20 32 30 26 C 38 20 42 58 48 58 C 54 58 56 28 66 26 C 74 24 76 68 82 66" stroke="#c084fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>MAZ AI</span>
      </div>
      <button class="top-new-chat-btn" title="New Chat" onclick="clearChat()">+</button>
    </header>

    <div id="chat-container"></div>

    <footer>
      <div class="input-card">
        <div id="image-preview-container">
          <img id="image-preview" src="" alt="Selected Preview" />
          <button id="remove-image-btn" onclick="removeSelectedImage()">✕</button>
        </div>

        <div class="input-row">
          <input type="text" id="user-input" placeholder="Ask MAZ AI or paste image..." onkeydown="if(event.key==='Enter') sendMessage()" onpaste="handlePaste(event)" />
        </div>
        <div class="actions-row">
          <div class="actions-left">
            <button class="icon-btn" title="Add file" onclick="document.getElementById('file-input').click()">+</button>
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)" />

            <button class="icon-btn" id="mic-btn" title="Speak" onclick="toggleVoiceInput()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>

            <button class="think-btn" id="think-toggle" onclick="toggleThink()">
              🧠 <span>Think</span>
            </button>
          </div>
          <button class="send-arrow-btn" onclick="sendMessage()">➔</button>
        </div>
      </div>
      <p class="disclaimer-text">MAZ is AI and can make mistakes.</p>
    </footer>
  </div>

  <script>
    let currentUserEmail = localStorage.getItem('maz_user_email') || null;
    let isThinkActive = false;
    let selectedImageBase64 = null;
    let chatHistory = [];
    let recognition = null;
    let isRecording = false;

    if (currentUserEmail) {
      document.getElementById('login-overlay').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderEmptyState();
      setupSpeechRecognition();
    });

    function renderEmptyState() {
      const container = document.getElementById('chat-container');
      container.innerHTML = `
        <div class="welcome-placeholder" id="welcome-placeholder">
          <svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" fill="#120924" stroke="#8b5cf6" stroke-width="4"/>
            <path d="M 22 68 C 22 68 20 32 30 26 C 38 20 42 58 48 58 C 54 58 56 28 66 26 C 74 24 76 68 82 66" stroke="#c084fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>MAZ AI</h1>
          <p>How can I help you today?</p>
        </div>
      `;
    }

    function handleCredentialResponse(response) {
      const responsePayload = jwt_decode(response.credential);
      currentUserEmail = responsePayload.email;
      localStorage.setItem('maz_user_email', currentUserEmail);
      document.getElementById('login-overlay').style.display = 'none';
    }

    function toggleThink() {
      isThinkActive = !isThinkActive;
      document.getElementById('think-toggle').classList.toggle('active', isThinkActive);
    }

    function clearChat() {
      window.speechSynthesis.cancel();
      chatHistory = [];
      removeSelectedImage();
      renderEmptyState();
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          document.getElementById('user-input').value = transcript;
          stopRecording();
        };

        recognition.onerror = () => stopRecording();
        recognition.onend = () => stopRecording();
      }
    }

    function toggleVoiceInput() {
      if (!recognition) {
        alert("Speech recognition is not supported in this browser.");
        return;
      }
      if (isRecording) {
        recognition.stop();
        stopRecording();
      } else {
        recognition.start();
        isRecording = true;
        const micBtn = document.getElementById('mic-btn');
        micBtn.classList.add('recording');
        micBtn.title = "Listening...";
      }
    }

    function stopRecording() {
      isRecording = false;
      const micBtn = document.getElementById('mic-btn');
      if (micBtn) {
        micBtn.classList.remove('recording');
        micBtn.title = "Speak";
      }
    }

    function speakText(text) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*_`#]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (file) processImageFile(file);
    }

    function handlePaste(event) {
      const items = (event.clipboardData || event.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf("image") !== -1) {
          processImageFile(item.getAsFile());
          event.preventDefault();
          break;
        }
      }
    }

    function processImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        selectedImageBase64 = e.target.result;
        document.getElementById('image-preview').src = selectedImageBase64;
        document.getElementById('image-preview-container').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function removeSelectedImage() {
      selectedImageBase64 = null;
      document.getElementById('file-input').value = '';
      document.getElementById('image-preview').src = '';
      document.getElementById('image-preview-container').style.display = 'none';
    }

    function copyCodeToClipboard(button, textToCopy) {
      navigator.clipboard.writeText(textToCopy).then(() => {
        button.innerText = 'Copied!';
        setTimeout(() => { button.innerText = 'Copy'; }, 2000);
      });
    }

    // Fixed Markdown & Code Parser
    function renderMarkdown(rawText) {
      const blocks = [];
      
      // Extract code blocks first
      let placeholderText = rawText.replace(/```([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        const index = blocks.length;
        blocks.push({ lang: lang || 'code', code: code.trim() });
        return `___CODE_BLOCK_${index}___`;
      });

      // Escape normal HTML
      let html = placeholderText
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Format bold and inline code
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");

      // Format lists and lines
      const lines = html.split("\n");
      let formattedHtml = "";
      let inList = false;

      for (let line of lines) {
        const trimmed = line.trim();

        if (trimmed.startsWith("___CODE_BLOCK_")) {
          if (inList) { formattedHtml += "</ul>"; inList = false; }
          formattedHtml += line;
          continue;
        }

        const listMatch = trimmed.match(/^-\s+(.*)$/);
        if (listMatch) {
          if (!inList) { formattedHtml += "<ul>"; inList = true; }
          formattedHtml += `<li>${listMatch[1]}</li>`;
        } else {
          if (inList) { formattedHtml += "</ul>"; inList = false; }
          if (trimmed === "") formattedHtml += "<br>";
          else formattedHtml += `<div>${trimmed}</div>`;
        }
      }
      if (inList) formattedHtml += "</ul>";

      // Re-insert highlighted code blocks
      blocks.forEach((item, index) => {
        let highlightedCode = item.code;
        if (window.hljs) {
          if (item.lang && hljs.getLanguage(item.lang)) {
            highlightedCode = hljs.highlight(item.code, { language: item.lang }).value;
          } else {
            highlightedCode = hljs.highlightAuto(item.code).value;
          }
        }

        const linesArr = highlightedCode.split('\n');
        const lineNumsHtml = linesArr.map((_, i) => `<div>${i + 1}</div>`).join('');
        const codeLinesHtml = linesArr.map(line => `<div>${line || ' '}</div>`).join('');
        const safeCodeForAttr = encodeURIComponent(item.code);

        const codeBlockHtml = `
          <div class="code-block-wrapper">
            <div class="code-header">
              <span>${item.lang}</span>
              <button class="code-copy-btn" onclick="copyCodeToClipboard(this, decodeURIComponent('${safeCodeForAttr}'))">Copy</button>
            </div>
            <div class="code-scroll-area">
              <table class="code-table">
                <tr>
                  <td class="line-numbers">${lineNumsHtml}</td>
                  <td class="code-content">${codeLinesHtml}</td>
                </tr>
              </table>
            </div>
          </div>
        `;

        formattedHtml = formattedHtml.replace(`___CODE_BLOCK_${index}___`, codeBlockHtml);
      });

      return formattedHtml;
    }

    function addMessageToUI(role, text, image) {
      const container = document.getElementById('chat-container');
      const placeholder = document.getElementById('welcome-placeholder');
      if (placeholder) placeholder.remove();

      const div = document.createElement('div');
      div.className = `message ${role}`;

      if (image) {
        const img = document.createElement('img');
        img.src = image;
        img.className = 'chat-img';
        div.appendChild(img);
      }

      if (text) {
        if (role === 'assistant') {
          const wrapper = document.createElement('div');
          wrapper.innerHTML = renderMarkdown(text);

          const speakBtn = document.createElement('button');
          speakBtn.className = 'speak-btn';
          speakBtn.innerHTML = '🔊 <span>Listen</span>';
          speakBtn.onclick = () => speakText(text);

          div.appendChild(wrapper);
          div.appendChild(speakBtn);
        } else {
          const textSpan = document.createElement('span');
          textSpan.textContent = text;
          div.appendChild(textSpan);
        }
      }

      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      const imageToSend = selectedImageBase64;

      if (!text && !imageToSend) return;

      addMessageToUI('user', text, imageToSend);

      let userMessageObj = { role: "user" };
      if (imageToSend) {
        userMessageObj.content = [
          { type: "text", text: text || "What is in this image?" },
          { type: "image_url", image_url: { url: imageToSend } }
        ];
      } else {
        userMessageObj.content = text;
      }

      chatHistory.push(userMessageObj);

      input.value = '';
      removeSelectedImage();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            history: chatHistory,
            user_email: currentUserEmail,
            think: isThinkActive
          })
        });

        const data = await res.json();
        const replyText = data.reply || "No response received.";

        addMessageToUI('assistant', replyText);
        chatHistory.push({ role: "assistant", content: replyText });

      } catch (err) {
        addMessageToUI('assistant', "Error connecting to server.");
      }
    }
  </script>
</body>
</html>
